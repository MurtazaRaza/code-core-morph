id: use_records
language: java
kind: api_changing
description: >-
  Turn immutable value classes (private final fields set once by the constructor, equals and
  hashCode over those fields, no subclass and no superclass) into records, keeping their
  accessors so callers don't change. Classes in the public API stay classes.
applies_to: {min_target_standard: java17}
detector:
  type: adapter_query
  query: record_candidates
llm:
  guidance: guidance/use_records.md
  examples: examples/use_records
skip:
  - public_api
