# The built-in C# to C++ port pack (SPEC §11.9, D-78, D-79).
name: csharp_to_cpp
language: csharp
api_version: "1"     # the rule pack API (rule format) this pack is written for (FR-15.3)
version: "1"
description: Port a C# library and its programs to C++, one type at a time, behind its own C# API.
