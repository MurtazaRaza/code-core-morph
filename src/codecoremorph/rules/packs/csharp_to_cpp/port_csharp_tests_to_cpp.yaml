id: port_csharp_tests_to_cpp
language: csharp
target_language: cpp
kind: port
port_units: tests                 # one unit per test file, after what it tests (D-78)
description: >-
  Translate the tests of one C# test file (NUnit, xUnit or MSTest) into a GoogleTest file, one
  test per C# test case, each mapped in the project's test map from its dotnet: ID to its
  gtest: ID. Both suites run while the C# lasts.
detector:
  type: adapter_query
  query: test_cases               # the file's tests, by their dotnet: IDs
codemods:
  - tool: cpp-csharp-tests        # the GoogleTest file and its CMake test program
extra_scope: ['cpp/**', 'CMakeLists.txt', '**/CodeCoreMorph.Interop.cs',
              '**/CodeCoreMorph.Native.g.cs', '**/CcmExceptions.cs']
llm:
  guidance: guidance/port_csharp_tests_to_cpp.md
postconditions:
  - {type: test_map, severity: error}           # every test mapped to a passing GoogleTest test
  - {type: lint_clean, severity: error}         # no warning, clang-tidy's checks quiet
