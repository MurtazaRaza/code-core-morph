id: port_csharp_program_to_cpp
language: csharp
target_language: cpp
kind: port
port_units: executable            # one unit per program, after the types it uses (D-78)
description: >-
  Port a C# program (a console project) to C++: its code becomes a function of the C++ library
  that the C# program calls until the retirement, so the tests that run the program run the
  C++, and a CMake program of the same name calls it.
detector:
  type: adapter_query
  query: csharp_programs          # each program project, at its Main
codemods:
  - tool: cpp-csharp-program      # the program's C++, its export and its CMake program
extra_scope: ['cpp/**', 'CMakeLists.txt', '**/CodeCoreMorph.Interop.cs',
              '**/CodeCoreMorph.Native.g.cs', '**/CcmExceptions.cs']
llm:
  guidance: guidance/port_csharp_program_to_cpp.md
postconditions:
  - {type: symbol_map, severity: error}         # every member of its types mapped
  - {type: lint_clean, severity: error}         # no warning, clang-tidy's checks quiet
skip:
  - test
