id: port_java_tests_to_rust
language: java
target_language: rust
kind: port
port_units: tests                 # one unit per test file, after what it tests (D-92)
description: >-
  Translate the tests of one Java test file (JUnit 3, 4 or 5) into the crate's Rust integration
  tests, one test per Java test case, each mapped in the project's test map from its junit: ID
  to its nextest: ID. Both suites run while the Java lasts.
detector:
  type: adapter_query
  query: test_cases               # the file's tests, by their junit: IDs
codemods:
  - tool: rust-java-tests         # the crate's test file
extra_scope: ['rust/**', '**/codecoremorph/interop/*.java']
llm:
  guidance: guidance/port_java_tests_to_rust.md
postconditions:
  - {type: test_map, severity: error}           # every test mapped to a passing Rust test
  - {type: lint_clean, severity: error}         # clippy is quiet about the tests
