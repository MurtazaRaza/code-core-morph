id: port_java_type_to_rust
language: java
target_language: rust
kind: port
port_units: java_type             # one unit per type, leaves first by references (D-92)
description: >-
  Port one type of a Java library to Rust, with the types it can't be split from (a reference
  cycle, or a class with overridable members and the library's classes that extend it), leaves
  first. The type keeps its Java API as a façade that calls the Rust through JNI, so the rest
  of the library and the project's own Java tests keep using it unchanged, and they decide
  whether the port is right; unsafe code stays in the crate's bridge.
detector:
  type: adapter_query
  query: java_types               # each type a library module declares
codemods:
  - tool: rust-java-type          # the workspace, the runtime, the crate, the unit's module and bridge
extra_scope: ['rust/**', '**/codecoremorph/interop/*.java']   # the Rust and the façades' support
llm:
  guidance: guidance/port_java_type_to_rust.md
postconditions:
  - {type: symbol_map, severity: error}         # every public member mapped to the Rust
  - {type: unsafe_in_bridge, severity: error}   # unsafe code only in the bridge
  - {type: lint_clean, severity: error}         # clippy is quiet about the new code
skip:
  - test                          # the Java tests stay Java: they judge the port
allow_suppressions: ['rust/*/src/bridge/**']   # C names and the JNI glue: the bridge
