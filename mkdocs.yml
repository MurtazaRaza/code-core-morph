site_name: CodeCoreMorph
site_description: >-
  Migrate codebases with LLM agents in a compile, test and fix loop, verified by real
  toolchains.
repo_url: https://github.com/MurtazaRaza/code-core-morph
repo_name: code-core-morph
edit_uri: edit/master/docs/
copyright: Apache-2.0

docs_dir: docs
exclude_docs: |
  hooks/
hooks:
  - docs/hooks/reference.py

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/brightness-7, name: Dark theme}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/brightness-4, name: Light theme}

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

validation:
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Concepts: concepts.md
  - Guides:
      - Migrating with Claude Code: claude-code.md
      - Porting C++ to Rust: porting-to-rust.md
      - Porting C to Rust: porting-c-to-rust.md
      - Porting Rust to C: porting-rust-to-c.md
      - Upgrading Java: upgrading-java.md
      - Upgrading C#: upgrading-csharp.md
      - The dashboard: dashboard.md
      - Installing dependencies: dependencies.md
      - Troubleshooting: troubleshooting.md
      - FAQ: faq.md
  - Reference:
      - Configuration: reference/configuration.md
      - CLI: reference/cli.md
  - Extending:
      - Writing rules: extending/rules.md
      - Writing a language adapter: extending/adapters.md
      - Writing an LLM provider: extending/providers.md
  - Security: security.md
  - Design:
      - Specification: SPEC.md
      - Implementation plan: IMPLEMENTATION_PLAN.md
